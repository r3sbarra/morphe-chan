[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "morphe-chan"
version = "0.1.0"
description = "Multi-dimensional geometric code analysis and synthesis: represent code as vectors with properties and compositing compound shapes."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "r3sbarra", email = "25109979+r3sbarra@users.noreply.github.com" }]
keywords = ["code-analysis", "code-synthesis", "shape", "vector", "static-analysis", "vulnerability-detection"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "basic-chan @ git+https://github.com/r3sbarra/basic-chan.git",
]

[project.urls]
Homepage = "https://github.com/r3sbarra/morphe-chan"
Repository = "https://github.com/r3sbarra/morphe-chan"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
mcp = [
    # The MCP server (src/morphe_chan_mcp) uses the legacy Server decorator API
    # (@server.list_tools / @server.call_tool). Pin to a version that still
    # provides server.list_tools; newer mcp removed it.
    "mcp<1.30",
]

[project.entry-points."basic_chan.sisters"]
morphe-chan = "code_shape.chan:morphe_chan"

[tool.setuptools]
package-dir = { "" = "src" }
packages = [
    "code_shape",
    "code_shape.adapters",
    "code_shape.core",
    "code_shape.analysis",
    "code_shape.security",
    "code_shape.synthesis",
    "code_shape.reports",
]

[tool.setuptools.package-data]
"code_shape" = ["../data/libraries/**/*.json"]

[project.scripts]
morphe-chan = "code_shape.cli:main"
